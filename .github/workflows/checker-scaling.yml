name: TypeScript 7 Checker Scaling

on:
  pull_request:
    paths:
      - scripts/benchmark-checker-scaling.mjs
      - scripts/write-ci-signals.mjs
      - scripts/ci-causal-graph.mjs
      - config/ci-causal-graph.json
      - package.json
      - package-lock.json
      - .github/workflows/checker-scaling.yml
  workflow_dispatch:
    inputs:
      checker_counts:
        description: Comma-separated TypeScript 7 checker counts
        required: true
        default: "1,2,4,8,16"
      generated_modules:
        description: Number of many-file workload modules
        required: true
        default: "1500"
      type_heavy_files:
        description: Number of type-heavy source files
        required: true
        default: "120"
      benchmark_runs:
        description: Measured rounds per scenario
        required: true
        default: "15"
      benchmark_warmups:
        description: Warm-up rounds per scenario
        required: true
        default: "2"

concurrency:
  group: typescript-7-checker-scaling-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checker-scaling:
    name: ${{ matrix.os }} / Node 22
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        id: install
        run: npm ci

      - name: Verify compiler selection
        id: compiler
        run: npm run verify:compiler-selection

      - name: Generate synthetic workloads
        run: npm run generate:synthetic
        env:
          GENERATED_MODULES: ${{ github.event_name == 'workflow_dispatch' && inputs.generated_modules || '300' }}
          TYPE_HEAVY_FILES: ${{ github.event_name == 'workflow_dispatch' && inputs.type_heavy_files || '24' }}
          PROJECT_PACKAGES: "4"
          PROJECT_FILES_PER_PACKAGE: "12"

      - name: Run checker scaling benchmark
        id: checker_benchmark
        run: npm run benchmark:checkers
        env:
          CHECKER_COUNTS: ${{ github.event_name == 'workflow_dispatch' && inputs.checker_counts || '1,2,4,8,16' }}
          CHECKER_BENCHMARK_RUNS: ${{ github.event_name == 'workflow_dispatch' && inputs.benchmark_runs || '3' }}
          CHECKER_BENCHMARK_WARMUPS: ${{ github.event_name == 'workflow_dispatch' && inputs.benchmark_warmups || '1' }}
          CHECKER_BENCHMARK_SEED: "20260624"

      - name: Record checker causal signals
        if: always()
        env:
          CI_SIGNAL_PROFILE: checker
          CI_SIGNAL_CONTEXT: ${{ matrix.os }}
          LOCKED_INSTALL_OUTCOME: ${{ steps.install.outcome }}
          COMPILER_SELECTION_OUTCOME: ${{ steps.compiler.outcome }}
          CHECKER_SCALING_OUTCOME: ${{ steps.checker_benchmark.outcome }}
        run: node scripts/write-ci-signals.mjs

      - name: Build checker causal report
        if: always()
        env:
          EXPECTED_CI_CONTEXTS: ${{ matrix.os }}
        run: node scripts/ci-causal-graph.mjs report results results/causal-checker

      - name: Publish checker explanation
        if: always()
        shell: bash
        run: cat results/causal-checker/child-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload checker scaling reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checker-scaling-${{ matrix.os }}
          path: |
            results/checker-scaling.latest.json
            results/checker-scaling.latest.md
            results/ci-signals-checker-*.json
            results/causal-checker/
          if-no-files-found: warn
          retention-days: 30
