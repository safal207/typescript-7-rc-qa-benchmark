name: TypeScript 7 Stable QA

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      generated_modules:
        description: Number of many-file workload modules
        required: true
        default: "1500"
      type_heavy_files:
        description: Number of type-heavy source files
        required: true
        default: "120"
      real_world_files:
        description: Number of generated type-fest consumer files
        required: true
        default: "64"
      project_packages:
        description: Number of referenced projects
        required: true
        default: "12"
      project_files_per_package:
        description: Source files per referenced project
        required: true
        default: "60"
      benchmark_runs:
        description: Measured rounds per scenario
        required: true
        default: "15"
      benchmark_warmups:
        description: Warm-up rounds per scenario
        required: true
        default: "2"
      bootstrap_resamples:
        description: Bootstrap resamples for median confidence intervals
        required: true
        default: "2000"

concurrency:
  group: typescript-7-stable-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compatibility-and-benchmark:
    name: ${{ matrix.os }} / Node 22
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pinned dependencies
        run: npm install

      - name: Verify compiler selection
        run: npm run verify:compiler-selection

      - name: Run stable QA harness
        run: npm run qa
        env:
          GENERATED_MODULES: ${{ github.event_name == 'workflow_dispatch' && inputs.generated_modules || '300' }}
          TYPE_HEAVY_FILES: ${{ github.event_name == 'workflow_dispatch' && inputs.type_heavy_files || '24' }}
          REAL_WORLD_FILES: ${{ github.event_name == 'workflow_dispatch' && inputs.real_world_files || '24' }}
          PROJECT_PACKAGES: ${{ github.event_name == 'workflow_dispatch' && inputs.project_packages || '4' }}
          PROJECT_FILES_PER_PACKAGE: ${{ github.event_name == 'workflow_dispatch' && inputs.project_files_per_package || '12' }}
          BENCHMARK_RUNS: ${{ github.event_name == 'workflow_dispatch' && inputs.benchmark_runs || '3' }}
          BENCHMARK_WARMUPS: ${{ github.event_name == 'workflow_dispatch' && inputs.benchmark_warmups || '1' }}
          BOOTSTRAP_RESAMPLES: ${{ github.event_name == 'workflow_dispatch' && inputs.bootstrap_resamples || '400' }}
          BENCHMARK_SEED: "20260710"
          VERIFY_OUTPUT_STRICT: "true"
          EVIDENCE_PROFILE: ${{ github.event_name == 'workflow_dispatch' && 'stable-full-v1' || 'stable-smoke-v1' }}

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stable-results-${{ matrix.os }}
          path: results/
          if-no-files-found: warn
          retention-days: 30

  stable-full-evidence:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/typescript-7-stable-validation'
    name: Full evidence / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pinned dependencies
        run: npm install

      - name: Verify compiler selection
        run: npm run verify:compiler-selection

      - name: Run full stable evidence profile
        run: npm run qa
        env:
          GENERATED_MODULES: "1500"
          TYPE_HEAVY_FILES: "120"
          REAL_WORLD_FILES: "64"
          PROJECT_PACKAGES: "12"
          PROJECT_FILES_PER_PACKAGE: "60"
          BENCHMARK_RUNS: "15"
          BENCHMARK_WARMUPS: "2"
          BOOTSTRAP_RESAMPLES: "2000"
          BENCHMARK_SEED: "20260710"
          VERIFY_OUTPUT_STRICT: "true"
          EVIDENCE_PROFILE: "stable-full-v1"

      - name: Upload full stable evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stable-full-results-${{ matrix.os }}
          path: results/
          if-no-files-found: warn
          retention-days: 90
